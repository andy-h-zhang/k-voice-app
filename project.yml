name: KVoice

options:
  bundleIdPrefix: ai.kizaki

packages:
  Core:
    path: Core

targets:
  KVoice:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - App
    dependencies:
      - package: Core
        product: KVoiceCore
    settings:
      base:
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1.2"
        CURRENT_PROJECT_VERSION: "3"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "KVoice records meetings using your microphone."
